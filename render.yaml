services:
  - type: web
    name: q3-mailroom
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: q3-mailroom-db
          property: connectionString
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false
databases:
  - name: q3-mailroom-db
